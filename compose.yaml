services:
  backend:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    read_only: true
    volumes:
      - user_data:/app/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

volumes:
  user_data:
